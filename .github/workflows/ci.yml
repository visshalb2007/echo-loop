name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Level data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate level data
        run: node tests/levels.test.js

  # GitHub Pages is not available for a private repo on the Free plan, so the
  # playable build is published as a workflow artifact instead (and attached to
  # a release when a v* tag is pushed).
  package:
    name: Build playable bundle
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the game for download
        run: bash scripts/package-web.sh
      - name: Assemble the site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r lib src _site/
      # Downloads as a zip with index.html at the root: extract and open it.
      - uses: actions/upload-artifact@v4
        with:
          name: echo-loop-web
          path: _site
          if-no-files-found: error
      # The same files as a single playable zip, kept for the release job.
      - uses: actions/upload-artifact@v4
        with:
          name: echo-loop-web-zip
          path: dist/echo-loop-web.zip
          if-no-files-found: error

  release:
    name: Attach build to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the game for download
        run: bash scripts/package-web.sh
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/echo-loop-web.zip --clobber
